name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:
  push:
    branches:
      - main
      - "runner/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  release-smoke-scope:
    name: Detect Release Smoke Scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect database and release changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
          RELEASE_SMOKE_LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'run-release-smoke') }}
        run: |
          set -eu
          required=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$RELEASE_SMOKE_LABELLED" = "true" ]; then
            required=true
          elif printf '%s' "$REF_NAME" | grep -q '^refs/heads/runner/'; then
            required=true
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            else
              case "$BEFORE_SHA" in
                ""|0000000000000000000000000000000000000000)
                  changed_files="$(git diff-tree --no-commit-id --name-only -r "$CURRENT_SHA")"
                  ;;
                *)
                  changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
                  ;;
              esac
            fi
            if printf '%s\n' "$changed_files" | grep -Eq '^(package\.json$|apps/api/src/(app\.module\.ts$|modules/(auth|field-policies|files|homestay|housing|property-approvals|property-identity|property-operations|property-tasks|units|work-orders)/|shared/(guards/(idempotency-key|property-high-risk-action)\.guard\.ts|interceptors/idempotency\.interceptor\.ts|services/idempotency\.service\.ts|property-workbench/property-high-risk-stopship\.ts)$)|packages/shared/src/(index\.ts$|property-business/)|database/(migrations|migration-prerequisites|migration-replacements|seeds)/|database/(migration-history-aliases|migration-replacements)\.txt$|scripts/(e2e/(homestay-api-e2e|housing-rental-api-e2e|property-api-e2e-(approval|gate(\.contract)?|safety))\.mjs|e2e/property-api-e2e-fixtures\.sql|(db-migrate|db-seed-prod|bootstrap-admin|check-init-baseline|prod-deploy|prod-healthcheck|prod-docker-cleanup)\.sh)$|infra/docker/docker-compose\.prod\.yml$|\.github/workflows/(ci|deploy-production)\.yml$)'; then
              required=true
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          printf 'Release Smoke required: %s\n' "$required"

  verify:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production seed decision precedence
        run: scripts/e2e/prod-deploy-seed-precedence.sh

      - name: Verify Track B production seed contracts
        run: pnpm test:e2e:property-track-b-seed-reconcile

      - name: Verify property role template contracts
        run: pnpm test:e2e:property-role-template

      - name: Verify property API E2E gate contract
        run: pnpm test:e2e:property-api-gate-contract

      - name: Verify engineering project manager RBAC contract
        run: pnpm test:e2e:jh-engineering-project-manager-rbac

      - name: Verify Yuzhou production import stays sealed and unreachable
        run: |
          pnpm test:e2e:yuzhou-production-import-preflight
          pnpm test:e2e:yuzhou-production-import-v2

      - name: Lint
        run: pnpm lint

      - name: Build shared workspace types
        run: pnpm --filter @jinhu/shared build

      - name: Test shared role template contracts
        run: pnpm --filter @jinhu/shared test

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  release-smoke:
    name: Release Smoke
    if: needs.release-smoke-scope.outputs.required == 'true'
    needs:
      - verify
      - release-smoke-scope
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: property-api-e2e-${{ github.run_id }}
      COMPOSE_FILE: /home/runner/work/jinhu-smart-park/jinhu-smart-park/infra/docker/docker-compose.prod.yml
      NPM_REGISTRY: https://registry.npmjs.org
      NODE_ENV: production
      APP_ENV: ci
      APP_PORT: 3001
      API_PREFIX: api/v1
      WEB_ORIGIN: http://127.0.0.1:3000
      POSTGRES_DB: jinhu_release_smoke
      POSTGRES_USER: jinhu
      POSTGRES_PASSWORD: JinhuReleaseSmokeDb#2026
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PUBLISHED_PORT: 5432
      API_PUBLISHED_PORT: 3001
      WEB_PUBLISHED_PORT: 3000
      TENANT_ID: 10000001
      PARK_ID: 20000001
      ADMIN_USERNAME: bootstrap_admin_ci
      ADMIN_PASSWORD: JinhuReleaseSmokeAdmin#2026
      ADMIN_NAME: Bootstrap Admin CI
      ADMIN_EMAIL: bootstrap.admin.ci@example.com
      ADMIN_PHONE: 13800001234
      ROLE_CODE: SUPER_ADMIN
      JWT_SECRET: JinhuReleaseSmokeJwtSecret#2026_LongAndRandom
      # Public, deterministic key for the disposable synthetic CI database only.
      # Production must use an independent random secret that remains stable across deploys.
      PARTY_DATA_ENCRYPTION_KEY: ${{ github.sha }}
      JWT_EXPIRES_IN: 8h
      BCRYPT_SALT_ROUNDS: 10
      FILE_STORAGE_LOCAL_ROOT: /var/lib/jinhu/files
      AUTH_SMS_FIXED_CODE: ""
      AUTH_SMS_CODE_VISIBLE: "false"
      AUTH_WECHAT_MOCK_ENABLED: "false"
      DEFAULT_TENANT_CODE: jinhu
      DEFAULT_TENANT_ID: 10000001
      DEFAULT_PARK_ID: 20000001
      NEXT_PUBLIC_API_TARGET: http://api:3001
      NEXT_PUBLIC_API_PREFIX: /api/v1
      POSTGRES_CTN: jinhu-smart-park-prod-postgres
      API_CTN: jinhu-smart-park-prod-api
      API_BASE: http://127.0.0.1:3001/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # The job runs with NODE_ENV=production, but its database-backed
        # regression specs still require test-only tooling such as ts-node.
        run: pnpm install --frozen-lockfile --prod=false

      - name: Create release smoke log directory
        run: mkdir -p /tmp/release-smoke-logs

      - name: Start PostgreSQL
        run: docker compose -f "$COMPOSE_FILE" up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$POSTGRES_CTN" 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL container did not become healthy in time" >&2
          exit 1

      - name: Run migration
        run: pnpm db:migrate 2>&1 | tee /tmp/release-smoke-logs/db-migrate.log

      - name: Verify Yuzhou production import v2 PostgreSQL controls
        run: |
          lab_db="jinhu_hr_migration_lab_ci_${GITHUB_RUN_ID}"
          cleanup_lab_db() {
            docker exec "$POSTGRES_CTN" dropdb -U "$POSTGRES_USER" --if-exists --force "$lab_db" >/dev/null 2>&1 || true
          }
          trap cleanup_lab_db EXIT
          cleanup_lab_db
          docker exec "$POSTGRES_CTN" createdb -U "$POSTGRES_USER" -T "$POSTGRES_DB" "$lab_db"
          YUZHOU_POSTGRES_CONTAINER="$POSTGRES_CTN" \
          YUZHOU_TARGET_DATABASE="$lab_db" \
          YUZHOU_EXPECTED_POSTGRES_COMPOSE_PROJECT="$COMPOSE_PROJECT_NAME" \
            pnpm test:e2e:yuzhou-production-import-v2:pg \
            2>&1 | tee /tmp/release-smoke-logs/yuzhou-production-import-v2-pg.log

      - name: Verify housing task reconciliation PostgreSQL parameter types
        env:
          PROPERTY_TASK_RECONCILIATION_PG_URL: postgresql://jinhu:JinhuReleaseSmokeDb%232026@127.0.0.1:5432/jinhu_release_smoke
          PROPERTY_TASK_PG_GATE_REQUIRED: "1"
          PROPERTY_TASK_PG_DISPOSABLE: "1"
        run: |
          pnpm --filter @jinhu/shared build
          pnpm --filter @jinhu/api exec node --test --require ts-node/register \
            src/modules/property-tasks/property-task.reconciliation.scheduler.pg.spec.ts \
            2>&1 | tee /tmp/release-smoke-logs/property-task-reconciliation-pg.log

      - name: Verify property MVP owner scope constraints
        env:
          DATABASE_URL: postgresql://jinhu:JinhuReleaseSmokeDb%232026@127.0.0.1:5432/jinhu_release_smoke
        run: pnpm --filter @jinhu/api exec node --test --require ts-node/register src/modules/homestay/property-mvp-owner-scope.pg.spec.ts

      - name: Verify migration history filename alias replay
        run: |
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
          BEGIN;
          UPDATE public.sys_schema_migration_history
          SET filename = '000183_floor_layout_deleted_file_backfill.sql'
          WHERE filename = '000199_floor_layout_deleted_file_backfill.sql';
          UPDATE public.schema_migrations
          SET filename = '000183_floor_layout_deleted_file_backfill.sql'
          WHERE filename = '000199_floor_layout_deleted_file_backfill.sql';
          COMMIT;
          SQL

          pnpm db:migrate 2>&1 | tee /tmp/release-smoke-logs/db-migrate-alias-replay.log
          grep -Fq \
            'REKEY MIGRATION HISTORY: 000183_floor_layout_deleted_file_backfill.sql -> 000199_floor_layout_deleted_file_backfill.sql' \
            /tmp/release-smoke-logs/db-migrate-alias-replay.log
          grep -Fq \
            'SKIP: 000199_floor_layout_deleted_file_backfill.sql (already succeeded, checksum matched)' \
            /tmp/release-smoke-logs/db-migrate-alias-replay.log

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
          BEGIN;
          INSERT INTO public.sys_schema_migration_history (
            filename, checksum, status, started_at, finished_at, error_message,
            executed_by, batch_id, created_at, updated_at
          )
          SELECT '000183_floor_layout_deleted_file_backfill.sql', checksum, status,
                 started_at, finished_at, error_message, executed_by, batch_id,
                 created_at, updated_at
          FROM public.sys_schema_migration_history
          WHERE filename = '000199_floor_layout_deleted_file_backfill.sql';
          INSERT INTO public.schema_migrations (
            filename, checksum, status, started_at, finished_at, error_message,
            executed_by, batch_id, created_at, updated_at
          )
          SELECT '000183_floor_layout_deleted_file_backfill.sql', checksum, status,
                 started_at, finished_at, error_message, executed_by, batch_id,
                 created_at, updated_at
          FROM public.schema_migrations
          WHERE filename = '000199_floor_layout_deleted_file_backfill.sql';
          COMMIT;
          SQL

          expect_alias_replay_failure() {
            case_name="$1"
            expected_error="$2"
            failure_log="/tmp/release-smoke-logs/db-migrate-alias-${case_name}.log"
            if pnpm db:migrate > "$failure_log" 2>&1; then
              echo "Unsafe duplicate migration history case unexpectedly succeeded: $case_name" >&2
              exit 1
            fi
            grep -Fq "$expected_error" "$failure_log"
          }

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "DELETE FROM public.schema_migrations
                WHERE filename = 'migration-alias:000183_floor_layout_deleted_file_backfill.sql=>000199_floor_layout_deleted_file_backfill.sql';"
          expect_alias_replay_failure \
            missing-standard-marker \
            'ERROR: migration history tables disagree; manual inspection is required.'
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "INSERT INTO public.schema_migrations (
                  filename, checksum, status, started_at, finished_at, error_message,
                  executed_by, batch_id, created_at, updated_at
                )
                SELECT filename, checksum, status, started_at, finished_at, error_message,
                       executed_by, batch_id, created_at, updated_at
                FROM public.sys_schema_migration_history
                WHERE filename = 'migration-alias:000183_floor_layout_deleted_file_backfill.sql=>000199_floor_layout_deleted_file_backfill.sql';"

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "DELETE FROM public.schema_migrations
                WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';"
          expect_alias_replay_failure \
            missing-standard-legacy \
            'ERROR: migration history tables disagree; manual inspection is required.'
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "INSERT INTO public.schema_migrations (
                  filename, checksum, status, started_at, finished_at, error_message,
                  executed_by, batch_id, created_at, updated_at
                )
                SELECT filename, checksum, status, started_at, finished_at, error_message,
                       executed_by, batch_id, created_at, updated_at
                FROM public.sys_schema_migration_history
                WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';"

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "UPDATE public.sys_schema_migration_history
                SET checksum = repeat('1', 64)
                WHERE filename = 'migration-alias:000183_floor_layout_deleted_file_backfill.sql=>000199_floor_layout_deleted_file_backfill.sql';
                UPDATE public.schema_migrations
                SET checksum = repeat('1', 64)
                WHERE filename = 'migration-alias:000183_floor_layout_deleted_file_backfill.sql=>000199_floor_layout_deleted_file_backfill.sql';"
          expect_alias_replay_failure \
            marker-drift \
            'ERROR: migration history alias audit marker drifted'

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "UPDATE public.sys_schema_migration_history
                SET checksum = 'b8187f89e8810abeaac09f7e615e9247335e6a9655550e74886d65b4a2e1bdc3'
                WHERE filename = 'migration-alias:000183_floor_layout_deleted_file_backfill.sql=>000199_floor_layout_deleted_file_backfill.sql';
                UPDATE public.schema_migrations
                SET checksum = 'b8187f89e8810abeaac09f7e615e9247335e6a9655550e74886d65b4a2e1bdc3'
                WHERE filename = 'migration-alias:000183_floor_layout_deleted_file_backfill.sql=>000199_floor_layout_deleted_file_backfill.sql';
                UPDATE public.sys_schema_migration_history
                SET checksum = repeat('2', 64)
                WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';"
          expect_alias_replay_failure \
            cross-table-drift \
            'ERROR: migration history tables disagree; manual inspection is required.'

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "UPDATE public.sys_schema_migration_history
                SET checksum = 'b8187f89e8810abeaac09f7e615e9247335e6a9655550e74886d65b4a2e1bdc3'
                WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';
                UPDATE public.sys_schema_migration_history
                SET status = 'failed'
                WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';
                UPDATE public.schema_migrations
                SET status = 'failed'
                WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';"
          expect_alias_replay_failure \
            legacy-status-drift \
            'ERROR: both legacy and canonical migration history identities exist'

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
          BEGIN;
          UPDATE public.sys_schema_migration_history
          SET status = 'succeeded', checksum = repeat('0', 64)
          WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';
          UPDATE public.schema_migrations
          SET status = 'succeeded', checksum = repeat('0', 64)
          WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';
          COMMIT;
          SQL
          expect_alias_replay_failure \
            legacy-checksum-drift \
            'ERROR: both legacy and canonical migration history identities exist'

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "UPDATE public.sys_schema_migration_history
                SET checksum = 'b8187f89e8810abeaac09f7e615e9247335e6a9655550e74886d65b4a2e1bdc3'
                WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';
                UPDATE public.schema_migrations
                SET checksum = 'b8187f89e8810abeaac09f7e615e9247335e6a9655550e74886d65b4a2e1bdc3'
                WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';"

          pnpm db:migrate 2>&1 | tee /tmp/release-smoke-logs/db-migrate-alias-duplicate-replay.log
          grep -Fq \
            'COLLAPSE DUPLICATE MIGRATION HISTORY ALIAS: 000183_floor_layout_deleted_file_backfill.sql -> 000199_floor_layout_deleted_file_backfill.sql' \
            /tmp/release-smoke-logs/db-migrate-alias-duplicate-replay.log

          alias_contract_count="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT count(*) FROM (
                    SELECT filename, status FROM public.sys_schema_migration_history
                    UNION ALL
                    SELECT filename, status FROM public.schema_migrations
                  ) history
                  WHERE status = 'succeeded'
                    AND filename IN (
                      '000199_floor_layout_deleted_file_backfill.sql',
                      'migration-alias:000183_floor_layout_deleted_file_backfill.sql=>000199_floor_layout_deleted_file_backfill.sql'
                    );"
          )"
          test "$alias_contract_count" = "4"

          legacy_history_count="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT count(*) FROM (
                    SELECT filename FROM public.sys_schema_migration_history
                    UNION ALL
                    SELECT filename FROM public.schema_migrations
                  ) history
                  WHERE filename = '000183_floor_layout_deleted_file_backfill.sql';"
          )"
          test "$legacy_history_count" = "0"

      - name: Verify concurrent migration serialization
        run: |
          docker compose -f "$COMPOSE_FILE" exec -T \
            -e PGAPPNAME=ci-migration-lock-blocker postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT pg_advisory_lock(hashtextextended(current_database() || ':jinhu-db-migrate', 0)); SELECT pg_sleep(20);" &
          blocker_pid=$!

          blocker_ready=false
          for _ in $(seq 1 30); do
            blocker_lock_count="$(
              docker compose -f "$COMPOSE_FILE" exec -T postgres \
                psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -c "SELECT count(*)
                    FROM pg_stat_activity activity
                    JOIN pg_locks held_lock ON held_lock.pid = activity.pid
                    WHERE activity.application_name = 'ci-migration-lock-blocker'
                      AND held_lock.locktype = 'advisory'
                      AND held_lock.granted = true;"
            )"
            if [ "$blocker_lock_count" = "1" ]; then
              blocker_ready=true
              break
            fi
            sleep 1
          done
          test "$blocker_ready" = "true"

          pnpm db:migrate > /tmp/release-smoke-logs/db-migrate-lock-wait.log 2>&1 &
          migration_pid=$!
          migration_waiter_seen=false
          for _ in $(seq 1 30); do
            migration_waiter_count="$(
              docker compose -f "$COMPOSE_FILE" exec -T postgres \
                psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT count(*)
                    FROM pg_stat_activity activity
                    WHERE activity.application_name LIKE 'jinhu-db-migrate-%'
                      AND NOT EXISTS (
                        SELECT 1
                        FROM pg_locks held_lock
                        WHERE held_lock.pid = activity.pid
                          AND held_lock.locktype = 'advisory'
                          AND held_lock.granted = true
                      );"
            )"
            if [ "$migration_waiter_count" = "1" ]; then
              migration_waiter_seen=true
              break
            fi
            sleep 1
          done
          test "$migration_waiter_seen" = "true"
          wait "$blocker_pid"
          wait "$migration_pid"
          grep -Fq 'MIGRATION LOCK ACQUIRED:' /tmp/release-smoke-logs/db-migrate-lock-wait.log

      - name: Verify migration prerequisite history
        run: |
          prerequisite_succeeded_count="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT count(*) FROM (
                    SELECT filename, status FROM public.sys_schema_migration_history
                    UNION ALL
                    SELECT filename, status FROM public.schema_migrations
                  ) history
                  WHERE filename = 'prerequisite:000064_s3e_checkout_effective.sql:001_core_role_templates.sql'
                    AND status = 'succeeded';"
          )"
          test "$prerequisite_succeeded_count" = "2"

          asset_scope_prerequisite_succeeded_count="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT count(*) FROM (
                    SELECT filename, status FROM public.sys_schema_migration_history
                    UNION ALL
                    SELECT filename, status FROM public.schema_migrations
                  ) history
                  WHERE filename IN (
                    'prerequisite:000189_property_b_module_rbac_definitions.sql:002_asset_park_scope_id_unification.sql',
                    'prerequisite:000189_property_b_module_rbac_definitions.sql:003_asset_park_scope_reconcile.sql'
                  )
                    AND status = 'succeeded';"
          )"
          test "$asset_scope_prerequisite_succeeded_count" = "4"

          asset_scope_column_types="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -F '|' -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT string_agg(udt_name || ':' || character_maximum_length, ',' ORDER BY column_name)
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = 'asset_park'
                    AND column_name IN ('tenant_id', 'park_id');"
          )"
          test "$asset_scope_column_types" = "varchar:64,varchar:64"

          history_conflict_count="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT count(*)
                  FROM public.sys_schema_migration_history primary_history
                  FULL JOIN public.schema_migrations standard_history USING (filename)
                  WHERE primary_history.filename IS NULL
                     OR standard_history.filename IS NULL
                     OR primary_history.status IS DISTINCT FROM standard_history.status
                     OR primary_history.checksum IS DISTINCT FROM standard_history.checksum;"
          )"
          test "$history_conflict_count" = "0"

      - name: Run production seed
        run: |
          ALLOW_PRODUCTION_SEED=yes pnpm db:seed:prod 2>&1 | tee /tmp/release-smoke-logs/db-seed-prod.log
          ALLOW_PRODUCTION_SEED=yes pnpm db:seed:prod 2>&1 | tee -a /tmp/release-smoke-logs/db-seed-prod.log

      - name: Verify failed 000189 retry from rolled-back state
        run: |
          target_migration='000189_property_b_module_rbac_definitions.sql'
          type_prerequisite='prerequisite:000189_property_b_module_rbac_definitions.sql:002_asset_park_scope_id_unification.sql'
          projection_prerequisite='prerequisite:000189_property_b_module_rbac_definitions.sql:003_asset_park_scope_reconcile.sql'
          retry_db="${POSTGRES_DB}_000189_retry"
          retry_root="$(mktemp -d /tmp/jinhu-000189-retry.XXXXXX)"
          retry_migrations="$retry_root/migrations"
          retry_aliases="$retry_root/migration-history-aliases.txt"
          retry_seeds="$retry_root/seeds"
          mkdir -p "$retry_migrations"
          mkdir -p "$retry_seeds/production"
          : > "$retry_aliases"
          cp database/seeds/000001_s1_production_core.sql "$retry_seeds/000001_s1_production_core.sql"
          # This fixture intentionally stops before 000189, so 000205 has not
          # yet made role-data-scope binding uniqueness park-scoped.
          sed -i \
            's/ON CONFLICT (tenant_id, park_id, role_id, rule_id) WHERE is_deleted = false/ON CONFLICT (tenant_id, role_id, rule_id) WHERE is_deleted = false/' \
            "$retry_seeds/000001_s1_production_core.sql"
          grep -Fq \
            'ON CONFLICT (tenant_id, role_id, rule_id) WHERE is_deleted = false' \
            "$retry_seeds/000001_s1_production_core.sql"

          cleanup_retry_db() {
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres \
              -c "DROP DATABASE IF EXISTS \"$retry_db\" WITH (FORCE);" >/dev/null 2>&1 || true
            rm -rf "$retry_root"
          }
          trap cleanup_retry_db EXIT
          trap 'exit 130' HUP INT TERM

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres \
            -c "DROP DATABASE IF EXISTS \"$retry_db\" WITH (FORCE);"
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres \
            -c "CREATE DATABASE \"$retry_db\";"

          for migration in database/migrations/*.sql; do
            migration_name="$(basename "$migration")"
            if [[ "$migration_name" < "$target_migration" ]]; then
              cp "$migration" "$retry_migrations/$migration_name"
            fi
          done

          POSTGRES_DB="$retry_db" \
          MIGRATIONS_DIR="$retry_migrations" \
          MIGRATION_HISTORY_ALIASES_FILE="$retry_aliases" \
          MIGRATION_BASELINE_ON_NONEMPTY_DB=no \
            pnpm db:migrate 2>&1 | tee /tmp/release-smoke-logs/db-migrate-000188-retry-baseline.log

          ALLOW_PRODUCTION_SEED=yes \
          SEEDS_DIR="$retry_seeds" \
          POSTGRES_DB="$retry_db" \
            pnpm db:seed:prod 2>&1 | tee /tmp/release-smoke-logs/db-seed-000188-retry-baseline.log

          # An existing unique asset projection already satisfies immutable
          # migration 000189. Its business row must remain untouched even when
          # no same-scope biz_park exists.
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" <<'SQL'
          BEGIN;
          INSERT INTO public.asset_park (
            tenant_id, park_id, park_code, park_name, address, total_area, status, remark
          )
          SELECT
            '10000001', '20000001', park_code, park_name, address, total_area,
            'enabled', 'release-smoke existing asset projection sentinel'
          FROM public.biz_park
          WHERE park_code = 'JH'
            AND status = 1
            AND is_deleted = false;
          DELETE FROM public.biz_park
          WHERE park_code = 'JH'
            AND is_deleted = false;
          COMMIT;
          SQL

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
            < database/migration-prerequisites/000189_property_b_module_rbac_definitions/003_asset_park_scope_reconcile.sql

          existing_projection_state="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -F '|' -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
              -c "SELECT
                    (SELECT count(*) FROM public.asset_park
                     WHERE tenant_id = '10000001'
                       AND park_id = '20000001'
                       AND status = 'enabled'
                       AND is_deleted = false),
                    (SELECT remark FROM public.asset_park
                     WHERE tenant_id = '10000001'
                       AND park_id = '20000001'
                       AND status = 'enabled'
                       AND is_deleted = false),
                    (SELECT count(*) FROM public.biz_park
                     WHERE tenant_id = '10000001'
                       AND park_id = '20000001'
                       AND status = 1
                       AND is_deleted = false);"
          )"
          test "$existing_projection_state" = "1|release-smoke existing asset projection sentinel|0"

          # Duplicate active destination rows are ambiguous even when one row
          # was already valid; the prerequisite must not pick or overwrite one.
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
            -c "INSERT INTO public.asset_park (
                  tenant_id, park_id, park_code, park_name, total_area, status, remark
                ) VALUES (
                  '10000001', '20000001', 'JH-AMBIGUOUS', '歧义园区', 0,
                  'enabled', 'release-smoke ambiguity sentinel'
                );"
          if docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
              < database/migration-prerequisites/000189_property_b_module_rbac_definitions/003_asset_park_scope_reconcile.sql \
              > /tmp/release-smoke-logs/db-migrate-000189-ambiguous-asset.log 2>&1; then
            echo "Expected duplicate active asset projections to fail closed" >&2
            exit 1
          fi
          grep -Fq 'ambiguous_asset=1' \
            /tmp/release-smoke-logs/db-migrate-000189-ambiguous-asset.log

          # A genuinely missing destination with no exact or bounded default
          # source also remains fail closed.
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
            -c "DELETE FROM public.asset_park
                WHERE tenant_id = '10000001'
                  AND park_id = '20000001'
                  AND is_deleted = false;"
          if docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
              < database/migration-prerequisites/000189_property_b_module_rbac_definitions/003_asset_park_scope_reconcile.sql \
              > /tmp/release-smoke-logs/db-migrate-000189-missing-source.log 2>&1; then
            echo "Expected a missing asset projection without a trusted source to fail closed" >&2
            exit 1
          fi
          grep -Fq 'unresolved_source=1' \
            /tmp/release-smoke-logs/db-migrate-000189-missing-source.log

          # Multiple exact active sources are ambiguous even in the fixed
          # default scope. The bounded JH fallback applies only when the exact
          # scope has no active source.
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" <<'SQL'
          BEGIN;
          INSERT INTO public.biz_park (
            tenant_id, park_id, park_code, park_name, status, remark
          ) VALUES
            ('10000001', '20000001', 'JH', '金湖科创产业园', 1,
             'release-smoke fixed default source'),
            ('10000001', '20000001', 'JH-AUXILIARY', '同作用域辅助园区', 1,
             'release-smoke same-scope non-default source');
          COMMIT;
          SQL
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
            < database/migration-prerequisites/000189_property_b_module_rbac_definitions/003_asset_park_scope_reconcile.sql
          if docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
              < database/seeds/production/000007_asset_park_scope_reconcile.sql \
              > /tmp/release-smoke-logs/db-seed-000189-default-ambiguous.log 2>&1; then
            echo "Expected production seed to reject multiple exact default-scope sources" >&2
            exit 1
          fi
          grep -Fq 'ambiguous_asset=1' \
            /tmp/release-smoke-logs/db-seed-000189-default-ambiguous.log
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
            -c "DELETE FROM public.biz_park
                WHERE tenant_id = '10000001'
                  AND park_id = '20000001'
                  AND park_code = 'JH-AUXILIARY'
                  AND is_deleted = false;"
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
            < database/migration-prerequisites/000189_property_b_module_rbac_definitions/003_asset_park_scope_reconcile.sql
          default_multi_source_state="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -F '|' -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
              -c "SELECT count(*), min(park_code)
                  FROM public.asset_park
                  WHERE tenant_id = '10000001'
                    AND park_id = '20000001'
                    AND status = 'enabled'
                    AND is_deleted = false;"
          )"
          test "$default_multi_source_state" = "1|JH"

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
            -c "DELETE FROM public.asset_park
                WHERE tenant_id = '10000001'
                  AND park_id = '20000001'
                  AND is_deleted = false;"
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
            < database/seeds/production/000007_asset_park_scope_reconcile.sql
          default_multi_source_seed_state="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -F '|' -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
              -c "SELECT count(*), min(park_code)
                  FROM public.asset_park
                  WHERE tenant_id = '10000001'
                    AND park_id = '20000001'
                    AND status = 'enabled'
                    AND is_deleted = false;"
          )"
          test "$default_multi_source_seed_state" = "1|JH"

          # Production-shape parity: a valid non-default active assignment can
          # exist without any trusted park source. The read-only diagnostic and
          # enforce gate must classify the same scope before deployment starts.
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" <<'SQL'
          BEGIN;
          INSERT INTO public.sys_tenant (
            tenant_id, park_id, tenant_code, tenant_name, status, remark
          ) VALUES (
            'release-smoke-tenant', 'release-smoke-park|ready_spoof', 'RELEASE-SMOKE-ORPHAN',
            'Release Smoke Orphan Scope', 1, 'release-smoke non-default orphan scope'
          );
          INSERT INTO public.rel_tenant_module (
            tenant_id, park_id, tenant_code, module_id, enabled, status, remark
          )
          SELECT
            'release-smoke-tenant', 'release-smoke-park|ready_spoof', 'RELEASE-SMOKE-ORPHAN',
            module.id, true, 'enabled', 'release-smoke non-default orphan scope'
          FROM public.sys_module module
          WHERE module.module_code = 'asset'
            AND module.status = 1
            AND module.is_deleted = false;
          COMMIT;
          SQL

          COMPOSE_FILE="$COMPOSE_FILE" ENV_FILE= \
            scripts/diagnose-000189-asset-scope.sh report . "$retry_db" \
            > /tmp/release-smoke-logs/db-migrate-000189-scope-diagnostic.log
          grep -Fq \
            'unresolved_source|release-smoke-tenant|release-smoke-park|ready_spoof|1|1|0|0|1|0|0|0|0|' \
            /tmp/release-smoke-logs/db-migrate-000189-scope-diagnostic.log
          if COMPOSE_FILE="$COMPOSE_FILE" ENV_FILE= \
            scripts/diagnose-000189-asset-scope.sh enforce . "$retry_db" \
              > /tmp/release-smoke-logs/db-migrate-000189-scope-gate.log 2>&1; then
            echo "Expected the non-default orphan asset scope gate to fail closed" >&2
            exit 1
          fi
          grep -Fq 'summary: scopes=2 blocked=1 mode=enforce' \
            /tmp/release-smoke-logs/db-migrate-000189-scope-gate.log
          grep -Fq 'ERROR: 000189 asset scope parity gate failed before deployment' \
            /tmp/release-smoke-logs/db-migrate-000189-scope-gate.log

          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" <<'SQL'
          BEGIN;
          DELETE FROM public.rel_tenant_module
          WHERE tenant_id = 'release-smoke-tenant'
            AND park_id = 'release-smoke-park|ready_spoof'
            AND remark = 'release-smoke non-default orphan scope';
          DELETE FROM public.sys_tenant
          WHERE tenant_id = 'release-smoke-tenant'
            AND tenant_code = 'RELEASE-SMOKE-ORPHAN'
            AND remark = 'release-smoke non-default orphan scope';
          COMMIT;
          SQL

          target_checksum="$(sha256sum "database/migrations/$target_migration" | awk '{print $1}')"
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" <<SQL
          BEGIN;
          -- Recreate the production legacy-seed shape: the globally unique JH
          -- park kept old scope IDs while the active module assignment uses the
          -- canonical production scope, and the asset projection is missing.
          DELETE FROM public.asset_park
          WHERE tenant_id = '10000001'
            AND park_id = '20000001'
            AND is_deleted = false;
          DELETE FROM public.biz_park
          WHERE tenant_id = '10000001'
            AND park_id = '20000001'
            AND is_deleted = false;
          INSERT INTO public.biz_park (
            tenant_id, park_id, park_code, park_name, status, remark
          ) VALUES (
            'legacy-tenant', 'legacy-park', 'JH', '金湖科创产业园', 1,
            'release-smoke legacy scope source'
          );

          -- A failed transaction leaves no 000189 catalog objects. Recreate the
          -- pre-000029 UUID shape to prove the new type prerequisite repairs a
          -- deliberately baselined legacy schema before inserting the projection.
          ALTER TABLE public.asset_park
            ALTER COLUMN tenant_id TYPE uuid USING tenant_id::uuid;
          ALTER TABLE public.asset_park
            ALTER COLUMN park_id TYPE uuid USING park_id::uuid;

          INSERT INTO public.sys_schema_migration_history (
            filename, checksum, status, started_at, finished_at, error_message, executed_by, batch_id
          ) VALUES (
            '$target_migration', '$target_checksum', 'failed', now(), now(),
            'release-smoke synthetic transaction rollback', 'release-smoke', '000189-retry'
          );
          INSERT INTO public.schema_migrations (
            filename, checksum, status, started_at, finished_at, error_message, executed_by, batch_id
          ) VALUES (
            '$target_migration', '$target_checksum', 'failed', now(), now(),
            'release-smoke synthetic transaction rollback', 'release-smoke', '000189-retry'
          );
          INSERT INTO public.sys_schema_migration_history (
            filename, checksum, status, started_at, finished_at, error_message, executed_by, batch_id
          ) VALUES (
            '$projection_prerequisite', repeat('0', 64), 'failed', now(), now(),
            'production scope reconcile preflight failed', 'release-smoke', '000189-retry'
          );
          INSERT INTO public.schema_migrations (
            filename, checksum, status, started_at, finished_at, error_message, executed_by, batch_id
          ) VALUES (
            '$projection_prerequisite', repeat('0', 64), 'failed', now(), now(),
            'production scope reconcile preflight failed', 'release-smoke', '000189-retry'
          );
          COMMIT;
          SQL

          pre_retry_state="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -F '|' -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
              -c "SELECT
                    (SELECT string_agg(udt_name, ',' ORDER BY column_name)
                     FROM information_schema.columns
                     WHERE table_schema = 'public'
                       AND table_name = 'asset_park'
                       AND column_name IN ('tenant_id', 'park_id')),
                    (SELECT count(*) FROM public.asset_park),
                    (SELECT count(*) FROM (VALUES
                       (to_regclass('public.sys_module_dependency')),
                       (to_regclass('public.sys_property_permission_bundle')),
                       (to_regclass('public.rel_property_permission_bundle_member'))
                     ) target(relation) WHERE relation IS NOT NULL),
                    (SELECT count(*) FROM (
                       SELECT filename, status FROM public.sys_schema_migration_history
                       UNION ALL
                       SELECT filename, status FROM public.schema_migrations
                     ) history WHERE filename = '$target_migration' AND status = 'failed'),
                    (SELECT count(*) FROM (
                       SELECT filename, status FROM public.sys_schema_migration_history
                       UNION ALL
                       SELECT filename, status FROM public.schema_migrations
                     ) history WHERE filename = '$projection_prerequisite' AND status = 'failed'),
                    (SELECT count(*) FROM public.biz_park
                     WHERE tenant_id = 'legacy-tenant'
                       AND park_id = 'legacy-park'
                       AND park_code = 'JH'
                       AND status = 1
                       AND is_deleted = false);"
          )"
          test "$pre_retry_state" = "uuid,uuid|0|0|2|2|1"

          cp "database/migrations/$target_migration" "$retry_migrations/$target_migration"
          POSTGRES_DB="$retry_db" \
          MIGRATIONS_DIR="$retry_migrations" \
          MIGRATION_HISTORY_ALIASES_FILE="$retry_aliases" \
          MIGRATION_BASELINE_ON_NONEMPTY_DB=no \
            pnpm db:migrate 2>&1 | tee /tmp/release-smoke-logs/db-migrate-000189-rollback-retry.log

          grep -Fq "SUCCESS PREREQUISITE: $type_prerequisite" \
            /tmp/release-smoke-logs/db-migrate-000189-rollback-retry.log
          grep -Fq "SUCCESS PREREQUISITE: $projection_prerequisite" \
            /tmp/release-smoke-logs/db-migrate-000189-rollback-retry.log
          grep -Fq "WARNING: retrying failed migration prerequisite with updated checksum: $projection_prerequisite" \
            /tmp/release-smoke-logs/db-migrate-000189-rollback-retry.log
          grep -Fq "APPLY: $target_migration" \
            /tmp/release-smoke-logs/db-migrate-000189-rollback-retry.log
          grep -Fq "SUCCESS: $target_migration" \
            /tmp/release-smoke-logs/db-migrate-000189-rollback-retry.log

          retry_state="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -F '|' -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$retry_db" \
              -c "SELECT
                    (SELECT string_agg(udt_name || ':' || character_maximum_length, ',' ORDER BY column_name)
                     FROM information_schema.columns
                     WHERE table_schema = 'public'
                       AND table_name = 'asset_park'
                       AND column_name IN ('tenant_id', 'park_id')),
                    (SELECT count(*) FROM public.asset_park
                     WHERE tenant_id = '10000001'
                       AND park_id = '20000001'
                       AND status = 'enabled'
                       AND is_deleted = false),
                    (SELECT count(*) FROM (VALUES
                       (to_regclass('public.sys_module_dependency')),
                       (to_regclass('public.sys_property_permission_bundle')),
                       (to_regclass('public.rel_property_permission_bundle_member'))
                     ) target(relation) WHERE relation IS NOT NULL),
                    (SELECT count(*) FROM (
                       SELECT filename, status FROM public.sys_schema_migration_history
                       UNION ALL
                       SELECT filename, status FROM public.schema_migrations
                     ) history
                     WHERE filename IN (
                       'prerequisite:000189_property_b_module_rbac_definitions.sql:001_asset_module.sql',
                       '$type_prerequisite',
                       '$projection_prerequisite'
                     ) AND status = 'succeeded'),
                    (SELECT count(*) FROM (
                       SELECT filename, status FROM public.sys_schema_migration_history
                       UNION ALL
                       SELECT filename, status FROM public.schema_migrations
                     ) history WHERE filename = '$target_migration' AND status = 'succeeded');"
          )"
          test "$retry_state" = "varchar:64,varchar:64|1|3|6|2"

      - name: Verify failed 000194 runtime-control retry from production-shaped state
        run: scripts/e2e/verify-000194-runtime-control-retry.sh

      - name: Verify 000207 canonical-source reconciliation
        run: scripts/e2e/verify-000207-canonical-source-reconcile.sh

      - name: Verify repaired core-role permissions
        run: |
          repaired_grant_count="$(
            docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT count(*)
                  FROM (VALUES
                    ('OPERATIONS_OWNER', 'safety_inspect_point:read'),
                    ('OPERATIONS_OWNER', 'ENGINEERING_PROJECT_VIEW'),
                    ('EXECUTIVE', 'safety_hazard:read'),
                    ('AUDITOR', 'ENGINEERING_PROJECT_VIEW')
                  ) expected(role_code, permission_code)
                  JOIN public.sys_role role
                    ON role.tenant_id = '10000001'
                   AND role.park_id = '20000001'
                   AND role.code = expected.role_code
                   AND role.is_deleted = false
                  JOIN public.sys_permission permission
                    ON permission.tenant_id = role.tenant_id
                   AND permission.park_id = role.park_id
                   AND permission.code = expected.permission_code
                   AND permission.is_deleted = false
                  JOIN public.rel_role_perm relation
                    ON relation.tenant_id = role.tenant_id
                   AND relation.park_id = role.park_id
                   AND relation.role_id = role.id
                   AND relation.permission_id = permission.id
                   AND relation.is_deleted = false;"
          )"
          test "$repaired_grant_count" = "4"

      - name: Verify Admin Issue Runner minimum-permission baseline
        run: |
          runner_baseline="$(docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT count(*)
                FROM public.sys_user app_user
                JOIN public.rel_user_role user_role
                  ON user_role.tenant_id = app_user.tenant_id
                 AND user_role.park_id = app_user.park_id
                 AND user_role.user_id = app_user.id
                 AND user_role.is_deleted = false
                JOIN public.sys_role role
                  ON role.id = user_role.role_id
                 AND role.tenant_id = app_user.tenant_id
                 AND role.code = 'SMART_PARK_RUNNER'
                 AND role.is_deleted = false
                JOIN public.rel_role_perm role_permission
                  ON role_permission.tenant_id = app_user.tenant_id
                 AND role_permission.park_id = app_user.park_id
                 AND role_permission.role_id = role.id
                 AND role_permission.is_deleted = false
                JOIN public.sys_permission permission
                  ON permission.id = role_permission.permission_id
                 AND permission.code = 'admin_issue:runner'
                 AND permission.is_deleted = false
                WHERE app_user.tenant_id = '10000001'
                  AND app_user.park_id = '20000001'
                  AND app_user.username = 'studio_runner'
                  AND app_user.is_enabled = false
                  AND app_user.status = 'disabled'
                  AND app_user.password_hash = '!SMART_PARK_RUNNER_CREDENTIAL_NOT_INITIALIZED!'
                  AND app_user.is_deleted = false;")"
          test "$runner_baseline" = "1"

          excessive_permission_count="$(docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT count(*)
                FROM public.sys_role role
                JOIN public.rel_role_perm role_permission
                  ON role_permission.role_id = role.id AND role_permission.is_deleted = false
                JOIN public.sys_permission permission
                  ON permission.id = role_permission.permission_id AND permission.is_deleted = false
                WHERE role.tenant_id = '10000001'
                  AND role.code = 'SMART_PARK_RUNNER'
                  AND role.is_deleted = false
                  AND permission.code <> 'admin_issue:runner';")"
          test "$excessive_permission_count" = "0"

      - name: Bootstrap admin
        run: pnpm db:bootstrap:admin 2>&1 | tee /tmp/release-smoke-logs/bootstrap-admin.log

      - name: Check init baseline
        run: pnpm db:check:init 2>&1 | tee /tmp/release-smoke-logs/check-init-baseline.log

      - name: Provision disposable property operation fixtures
        env:
          APPROVER_PASSWORD: JinhuReleaseSmokeApprover#2026
          APPROVER_2_PASSWORD: JinhuReleaseSmokeTransferApprover#2026
        run: |
          set -o pipefail
          hash_password() {
            cd apps/api
            PASSWORD_TO_HASH="$1" node -e '
              const bcrypt = require("bcrypt");
              const password = process.env.PASSWORD_TO_HASH;
              const rounds = Number(process.env.BCRYPT_SALT_ROUNDS || "12");
              if (!password) throw new Error("missing password");
              bcrypt.hash(password, rounds)
                .then((hash) => process.stdout.write(hash))
                .catch((error) => {
                  console.error(error && error.stack ? error.stack : String(error));
                  process.exit(1);
                });
            '
          }
          approver_hash="$(hash_password "$APPROVER_PASSWORD")"
          transfer_approver_hash="$(hash_password "$APPROVER_2_PASSWORD")"
          docker compose -f "$COMPOSE_FILE" exec -T postgres \
            psql -X -v ON_ERROR_STOP=1 -v tenant_id="$TENANT_ID" -v park_id="$PARK_ID" \
              -v approver_username="property_approver_ci" \
              -v approver_password_hash="$approver_hash" \
              -v approver_2_username="property_transfer_approver_ci" \
              -v approver_2_password_hash="$transfer_approver_hash" \
              -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              < scripts/e2e/property-api-e2e-fixtures.sql \
              2>&1 | tee /tmp/release-smoke-logs/property-api-e2e-fixtures.log

      - name: Start API
        run: docker compose -f "$COMPOSE_FILE" up -d api

      - name: Wait for API health
        run: |
          for _ in $(seq 1 40); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$API_CTN" 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "API container did not become healthy in time" >&2
          exit 1

      - name: Verify release smoke login flow
        run: bash scripts/verify-api-login-dockerexec.sh 2>&1 | tee /tmp/release-smoke-logs/verify-api-login.log

      - name: Run property API E2E gate
        env:
          PROPERTY_API_E2E_ISOLATED: "yes"
          PROPERTY_API_E2E_DOCKER_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
          PROPERTY_API_E2E_API_CONTAINER: ${{ env.API_CTN }}
          PROPERTY_API_E2E_POSTGRES_CONTAINER: ${{ env.POSTGRES_CTN }}
          API_BASE_URL: ${{ env.API_BASE }}
          APPROVER_USERNAME: property_approver_ci
          APPROVER_PASSWORD: JinhuReleaseSmokeApprover#2026
          APPROVER_2_USERNAME: property_transfer_approver_ci
          APPROVER_2_PASSWORD: JinhuReleaseSmokeTransferApprover#2026
          PROPERTY_API_E2E_REPORT_PATH: /tmp/release-smoke-logs/property-api-e2e-report.json
        run: |
          set -o pipefail
          pnpm test:e2e:property-api 2>&1 | tee /tmp/release-smoke-logs/property-api-e2e.log

      - name: Collect docker diagnostics
        if: always()
        run: |
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' > /tmp/release-smoke-logs/docker-ps.txt
          docker compose -f "$COMPOSE_FILE" ps > /tmp/release-smoke-logs/docker-compose-ps.txt
          docker logs "$POSTGRES_CTN" > /tmp/release-smoke-logs/postgres.log 2>&1 || true
          docker logs "$API_CTN" > /tmp/release-smoke-logs/api.log 2>&1 || true

      - name: Upload release smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-smoke-logs
          path: /tmp/release-smoke-logs
          if-no-files-found: warn

      - name: Tear down release smoke containers
        if: always()
        run: |
          docker compose -f "$COMPOSE_FILE" down -v --remove-orphans
          remaining_containers="$(docker compose -f "$COMPOSE_FILE" ps -aq)"
          test -z "$remaining_containers"
          for volume in "${COMPOSE_PROJECT_NAME}_postgres-data" "${COMPOSE_PROJECT_NAME}_api-files-data"; do
            if docker volume inspect "$volume" >/dev/null 2>&1; then
              echo "Disposable property E2E volume was not removed: $volume" >&2
              exit 1
            fi
          done
          echo "Assert disposable property E2E cleanup: PASS"
