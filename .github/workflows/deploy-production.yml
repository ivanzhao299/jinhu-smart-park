name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deployment mode. diagnose modes are read-only and never deploy."
        required: true
        default: auto
        type: choice
        options:
          - auto
          - fast-css
          - web
          - api
          - database
          - full
          - diagnose-production-runtime-revision
          - diagnose-000189-scope
          - diagnose-000194-runtime-control
          - diagnose-yuzhou-hr-production-target
          - diagnose-yuzhou-hr-capacity
          - diagnose-yuzhou-hr-preimport-snapshot
          - diagnose-yuzhou-hr-production-source-manifest
          - diagnose-yuzhou-hr-production-t0-target-inventory
          - diagnose-yuzhou-hr-production-target-inventory
          - prepare-yuzhou-hr-production-data-volume
      source_manifest_json:
        description: "Hash-only Yuzhou source-manifest receipt prepared in the data-custody environment; never provide source rows, files, paths, or credentials."
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    name: Classify production release
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve pre-verification scope
        id: scope
        env:
          REQUESTED_DEPLOY_MODE: ${{ inputs.deploy_mode }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          requested="${REQUESTED_DEPLOY_MODE:-auto}"
          case "$requested" in
            diagnose-production-runtime-revision|diagnose-000189-scope|diagnose-000194-runtime-control|diagnose-yuzhou-hr-production-target|diagnose-yuzhou-hr-capacity|diagnose-yuzhou-hr-preimport-snapshot|diagnose-yuzhou-hr-production-source-manifest|diagnose-yuzhou-hr-production-t0-target-inventory|diagnose-yuzhou-hr-production-target-inventory|prepare-yuzhou-hr-production-data-volume)
              echo "mode=ops-only" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$requested" = "auto" ]; then
              echo "mode=full" >> "$GITHUB_OUTPUT"
            else
              case "$requested" in
                fast-css|web|api|database|full) echo "mode=$requested" >> "$GITHUB_OUTPUT" ;;
                *) echo "Unsupported deployment mode: $requested" >&2; exit 2 ;;
              esac
            fi
            exit 0
          fi
          changed_files=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          fi
          printf '%s\n' "$changed_files" | node scripts/resolve-production-deploy-scope.mjs --requested=auto --github-output >> "$GITHUB_OUTPUT"

  verify:
    name: Verify production release
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable pnpm
        if: ${{ needs.classify.outputs.mode != 'ops-only' && needs.classify.outputs.mode != 'fast-css' }}
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: ${{ needs.classify.outputs.mode != 'ops-only' && needs.classify.outputs.mode != 'fast-css' }}
        run: pnpm install --frozen-lockfile

      - name: Validate deployment governance contracts
        run: |
          sh scripts/e2e/production-deploy-path-contract.sh
          node scripts/e2e/production-deploy-route-contract.mjs
          node scripts/e2e/yuzhou-production-target-inventory-contract.mjs
          node scripts/e2e/production-deploy-scope.contract.mjs
          node scripts/e2e/production-deploy-transfer.contract.mjs
          node scripts/e2e/production-deploy-verified-scope.contract.mjs
          node --test scripts/e2e/production-runtime-revision.contract.mjs
          sh scripts/e2e/production-backup-restore-gate-contract.sh
          sh scripts/e2e/production-data-disk-mount-contract.sh
          git diff --check

      - name: Validate runtime design system CSS
        if: ${{ needs.classify.outputs.mode == 'fast-css' }}
        run: node scripts/check-css-architecture.mjs

      - name: Build shared contracts
        if: ${{ needs.classify.outputs.mode == 'web' || needs.classify.outputs.mode == 'api' }}
        run: pnpm --filter @jinhu/shared build

      - name: Validate Web release
        if: ${{ needs.classify.outputs.mode == 'web' }}
        run: |
          pnpm --filter @jinhu/shared test
          pnpm --filter @jinhu/web typecheck
          pnpm --filter @jinhu/web lint
          pnpm test:unit:web
          pnpm css:check
          pnpm --filter @jinhu/web build

      - name: Validate API release
        if: ${{ needs.classify.outputs.mode == 'api' }}
        run: |
          pnpm --filter @jinhu/shared test
          pnpm --filter @jinhu/api typecheck
          pnpm --filter @jinhu/api lint
          pnpm --filter @jinhu/api test:unit
          pnpm --filter @jinhu/api build

      - name: Validate database-sensitive release
        if: ${{ needs.classify.outputs.mode == 'database' }}
        run: |
          sh -n scripts/db-migrate.sh scripts/db-seed-prod.sh scripts/bootstrap-admin.sh scripts/check-init-baseline.sh
          node scripts/e2e/migration-prerequisite-contract.mjs
          sh scripts/e2e/prod-deploy-seed-precedence.sh

      - name: Validate full release
        if: ${{ needs.classify.outputs.mode == 'full' }}
        run: |
          pnpm --filter @jinhu/shared build
          pnpm typecheck
          pnpm lint
          pnpm test:unit
          pnpm css:check
          pnpm build

  deploy:
    name: Deploy to production host
    needs: [classify, verify]
    if: ${{ needs.classify.outputs.mode != 'ops-only' || startsWith(inputs.deploy_mode, 'diagnose-') || inputs.deploy_mode == 'prepare-yuzhou-hr-production-data-volume' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Trust production host
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: ssh-keyscan -p "$PROD_SSH_PORT" -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Enforce Studio and production deployment path separation
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- '$PROD_DEPLOY_PATH'" < scripts/validate-production-deploy-path.sh

      - name: Resolve deployment mode
        if: ${{ inputs.deploy_mode != 'diagnose-production-runtime-revision' && inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target' && inputs.deploy_mode != 'diagnose-yuzhou-hr-capacity' && inputs.deploy_mode != 'diagnose-yuzhou-hr-preimport-snapshot' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-source-manifest' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-t0-target-inventory' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target-inventory' && inputs.deploy_mode != 'prepare-yuzhou-hr-production-data-volume' }}
        id: deploy-mode
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          REQUESTED_DEPLOY_MODE: ${{ inputs.deploy_mode }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          requested="${REQUESTED_DEPLOY_MODE:-auto}"
          run_production_seed="no"
          previous_commit="$(ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" "node -e \"try{const r=require('$PROD_DEPLOY_PATH/.release.json'); process.stdout.write(r.commit||'')}catch(e){}\"" || true)"
          previous_commit_valid="no"
          changed_files=""
          if [ -n "$previous_commit" ] && git cat-file -e "$previous_commit^{commit}" 2>/dev/null; then
            previous_commit_valid="yes"
            changed_files="$(git diff --name-only "$previous_commit" "$GITHUB_SHA" || true)"
          fi
          if [ "$previous_commit_valid" = "no" ] || printf "%s\n" "$changed_files" | grep -Eq '^database/seeds/(000001_s1_production_core\.sql|production/)'; then
            run_production_seed="yes"
          fi
          resolved="$(printf '%s\n' "$changed_files" | node scripts/resolve-production-deploy-scope.mjs --requested="$requested" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).mode))")"
          if [ "$run_production_seed" = "yes" ]; then
            case "$resolved" in
              web|fast-css|ops-only)
                echo "Production seed changes require a database-capable deployment; overriding mode '$resolved' to 'database'."
                resolved="database"
                ;;
            esac
          fi
          printf "requested=%s\nresolved=%s\nprevious_commit=%s\nrun_production_seed=%s\n" "$requested" "$resolved" "$previous_commit" "$run_production_seed"
          echo "mode=$resolved" >> "$GITHUB_OUTPUT"
          echo "run_production_seed=$run_production_seed" >> "$GITHUB_OUTPUT"

      - name: Enforce verified deployment scope
        if: ${{ inputs.deploy_mode != 'diagnose-production-runtime-revision' && inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target' && inputs.deploy_mode != 'diagnose-yuzhou-hr-capacity' && inputs.deploy_mode != 'diagnose-yuzhou-hr-preimport-snapshot' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-source-manifest' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-t0-target-inventory' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target-inventory' && inputs.deploy_mode != 'prepare-yuzhou-hr-production-data-volume' }}
        env:
          VERIFIED_DEPLOY_MODE: ${{ needs.classify.outputs.mode }}
          RESOLVED_DEPLOY_MODE: ${{ steps.deploy-mode.outputs.mode }}
        run: |
          set -eu
          node scripts/assert-verified-production-deploy-scope.mjs \
            --verified="$VERIFIED_DEPLOY_MODE" \
            --resolved="$RESOLVED_DEPLOY_MODE"

      - name: Diagnose production runtime image revisions (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-production-runtime-revision' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -eu
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo PRODUCTION_RUNTIME_EXPECTED_COMMIT_INVALID >&2; exit 1; }
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          if ! runtime_error="$(ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "node --input-type=module - --expected-commit '$GITHUB_SHA'" < scripts/diagnose-production-runtime-revision.mjs \
            2>&1 > "$RUNNER_TEMP/production-runtime-image-observation.json")"; then
            case "$runtime_error" in
              PRODUCTION_RUNTIME_EXPECTED_COMMIT_INVALID|PRODUCTION_RUNTIME_ARGUMENT_INVALID|PRODUCTION_RUNTIME_REVISION_UNAVAILABLE|PRODUCTION_RUNTIME_REVISION_MISMATCH|PRODUCTION_RUNTIME_CONTAINER_NOT_RUNNING|PRODUCTION_RUNTIME_CONTAINER_CHANGED|PRODUCTION_RUNTIME_IMAGE_METADATA_INVALID|PRODUCTION_RUNTIME_APPLICATION_MOUNT_OVERRIDE|PRODUCTION_RUNTIME_METADATA_INVALID|PRODUCTION_RUNTIME_MOUNT_METADATA_INVALID|PRODUCTION_RUNTIME_COMMAND_FAILED|PRODUCTION_RUNTIME_OBSERVATION_FAILED)
                printf '%s\n' "$runtime_error" >&2 ;;
              *) echo PRODUCTION_RUNTIME_REMOTE_OBSERVATION_FAILED >&2 ;;
            esac
            exit 1
          fi

      - name: Retain production runtime image observation
        if: ${{ inputs.deploy_mode == 'diagnose-production-runtime-revision' && success() }}
        uses: actions/upload-artifact@v6
        with:
          name: production-runtime-image-observation
          path: ${{ runner.temp }}/production-runtime-image-observation.json
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose 000189 asset scope parity (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-000189-scope' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- report '$PROD_DEPLOY_PATH'" < scripts/diagnose-000189-asset-scope.sh

      - name: Diagnose 000194 runtime control parity (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-000194-runtime-control' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- report '$PROD_DEPLOY_PATH'" < scripts/diagnose-000194-runtime-control.sh

      - name: Diagnose Yuzhou HR production target (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-production-target' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- report '$PROD_DEPLOY_PATH'" < scripts/diagnose-yuzhou-hr-production-target.sh > "$RUNNER_TEMP/yuzhou-hr-production-target-attestation.json"

      - name: Retain Yuzhou HR production target attestation
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-production-target' && success() }}
        uses: actions/upload-artifact@v6
        with:
          name: yuzhou-hr-production-target-attestation
          path: ${{ runner.temp }}/yuzhou-hr-production-target-attestation.json
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose Yuzhou HR production capacity (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-capacity' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- report '$PROD_DEPLOY_PATH'" < scripts/diagnose-yuzhou-hr-production-capacity.sh

      - name: Diagnose Yuzhou HR pre-import snapshot (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-preimport-snapshot' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- report '$PROD_DEPLOY_PATH'" < scripts/diagnose-yuzhou-hr-production-preimport-snapshot.sh > "$RUNNER_TEMP/yuzhou-hr-production-preimport-snapshot.json"

      - name: Retain Yuzhou HR pre-import snapshot receipt
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-preimport-snapshot' && success() }}
        uses: actions/upload-artifact@v6
        with:
          name: yuzhou-hr-production-preimport-snapshot
          path: ${{ runner.temp }}/yuzhou-hr-production-preimport-snapshot.json
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose Yuzhou HR production source manifest (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-production-source-manifest' }}
        env:
          YUZHOU_SOURCE_MANIFEST_JSON: ${{ inputs.source_manifest_json }}
        run: |
          set -eu
          node --input-type=module - > "$RUNNER_TEMP/yuzhou-hr-production-source-manifest.json" <<'NODE'
          import { verifyProductionSourceManifest } from "./scripts/prepare-yuzhou-production-source-manifest.mjs";

          const hold = reasonCode => process.stdout.write(`${JSON.stringify({ status: "HOLD", reasonCode, productionImport: "HOLD" })}\n`);
          const attestation = process.env.YUZHOU_SOURCE_MANIFEST_JSON ?? "";
          if (!attestation || Buffer.byteLength(attestation, "utf8") > 65535) {
            hold("PRODUCTION_SOURCE_MANIFEST_CONFIG_UNAVAILABLE");
          } else {
            try {
              const result = verifyProductionSourceManifest(attestation);
              process.stdout.write(`${JSON.stringify({ status: "PASS", manifestSha256: result.manifestSha256, phaseCount: result.phaseCount, productionImport: "HOLD" })}\n`);
            } catch (error) {
              const known = new Set(["PRODUCTION_SOURCE_MANIFEST_ATTESTATION_INVALID"]);
              hold(known.has(error?.code) ? error.code : "PRODUCTION_SOURCE_MANIFEST_FAILED");
            }
          }
          NODE

      - name: Retain Yuzhou HR production source manifest receipt
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-production-source-manifest' && success() }}
        uses: actions/upload-artifact@v6
        with:
          name: yuzhou-hr-production-source-manifest
          path: ${{ runner.temp }}/yuzhou-hr-production-source-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose Yuzhou HR T0 target inventory (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-production-t0-target-inventory' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          YUZHOU_SOURCE_MANIFEST_JSON: ${{ inputs.source_manifest_json }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- report '$PROD_DEPLOY_PATH'" < scripts/diagnose-yuzhou-hr-production-t0-target-inventory.sh > "$RUNNER_TEMP/yuzhou-hr-production-t0-target-inventory-host.json"
          node --input-type=module - > "$RUNNER_TEMP/yuzhou-hr-production-t0-target-inventory.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { verifyProductionSourceManifest } from "./scripts/prepare-yuzhou-production-source-manifest.mjs";

          const hold = reasonCode => process.stdout.write(`${JSON.stringify({ status: "HOLD", reasonCode, productionImport: "HOLD" })}\n`);
          try {
            const manifest = process.env.YUZHOU_SOURCE_MANIFEST_JSON ?? "";
            if (!manifest || Buffer.byteLength(manifest, "utf8") > 65535) {
              hold("PRODUCTION_SOURCE_MANIFEST_CONFIG_UNAVAILABLE");
            } else {
              const source = JSON.parse(manifest);
              const receipt = verifyProductionSourceManifest(source);
              const inventory = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/yuzhou-hr-production-t0-target-inventory-host.json", "utf8"));
              if (inventory?.formatVersion !== 1 || inventory.kind !== "yuzhou_hr_production_t0_target_inventory_readonly" || inventory.status !== "PASS" || inventory.productionImport !== "HOLD" || !Array.isArray(inventory.records)) throw new Error("inventory invalid");
              process.stdout.write(`${JSON.stringify({ ...inventory, sourceManifestSha256: receipt.manifestSha256, triple: { codeSha: process.env.GITHUB_SHA, sourceSnapshotHash: source.sourceSnapshotSha256, mappingContractHash: source.mappingContractSha256 } })}\n`);
            }
          } catch {
            hold("PRODUCTION_T0_TARGET_INVENTORY_BINDING_FAILED");
          }
          NODE

      - name: Retain Yuzhou HR T0 target inventory receipt
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-production-t0-target-inventory' && success() }}
        uses: actions/upload-artifact@v6
        with:
          name: yuzhou-hr-production-t0-target-inventory
          path: ${{ runner.temp }}/yuzhou-hr-production-t0-target-inventory.json
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose Yuzhou HR T0-T3 target inventory (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-production-target-inventory' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          YUZHOU_SOURCE_MANIFEST_JSON: ${{ inputs.source_manifest_json }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- report '$PROD_DEPLOY_PATH'" < scripts/diagnose-yuzhou-hr-production-target-inventory.sh > "$RUNNER_TEMP/yuzhou-hr-production-target-inventory-host.json"
          node --input-type=module - > "$RUNNER_TEMP/yuzhou-hr-production-target-inventory.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { verifyProductionSourceManifest } from "./scripts/prepare-yuzhou-production-source-manifest.mjs";

          const hold = reasonCode => process.stdout.write(`${JSON.stringify({ status: "HOLD", reasonCode, productionImport: "HOLD" })}\n`);
          try {
            const manifest = process.env.YUZHOU_SOURCE_MANIFEST_JSON ?? "";
            if (!manifest || Buffer.byteLength(manifest, "utf8") > 65535) {
              hold("PRODUCTION_SOURCE_MANIFEST_CONFIG_UNAVAILABLE");
            } else {
              const source = JSON.parse(manifest);
              const receipt = verifyProductionSourceManifest(source);
              const inventory = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/yuzhou-hr-production-target-inventory-host.json", "utf8"));
              if (inventory?.formatVersion !== 1 || inventory.kind !== "yuzhou_hr_production_target_inventory_readonly" || inventory.status !== "PASS" || inventory.productionImport !== "HOLD" || !Array.isArray(inventory.records) || Object.keys(inventory.targetTableCounts ?? {}).length !== 16) throw new Error("inventory invalid");
              process.stdout.write(`${JSON.stringify({ ...inventory, sourceManifestSha256: receipt.manifestSha256, triple: { codeSha: process.env.GITHUB_SHA, sourceSnapshotHash: source.sourceSnapshotSha256, mappingContractHash: source.mappingContractSha256 } })}\n`);
            }
          } catch {
            hold("PRODUCTION_TARGET_INVENTORY_BINDING_FAILED");
          }
          NODE

      - name: Retain Yuzhou HR T0-T3 target inventory receipt
        if: ${{ inputs.deploy_mode == 'diagnose-yuzhou-hr-production-target-inventory' && success() }}
        uses: actions/upload-artifact@v6
        with:
          name: yuzhou-hr-production-target-inventory
          path: ${{ runner.temp }}/yuzhou-hr-production-target-inventory.json
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Yuzhou HR production data volume
        if: ${{ inputs.deploy_mode == 'prepare-yuzhou-hr-production-data-volume' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "YUZHOU_PRODUCTION_DATA_VOLUME_ACTION=mount-empty-disk sh -s -- mount-empty-disk '$PROD_DEPLOY_PATH'" < scripts/mount-production-data-disk.sh

      - name: Ensure required production secrets
        if: ${{ inputs.deploy_mode != 'diagnose-production-runtime-revision' && inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target' && inputs.deploy_mode != 'diagnose-yuzhou-hr-capacity' && inputs.deploy_mode != 'diagnose-yuzhou-hr-preimport-snapshot' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-source-manifest' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-t0-target-inventory' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target-inventory' && inputs.deploy_mode != 'prepare-yuzhou-hr-production-data-volume' && steps.deploy-mode.outputs.mode != 'ops-only' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          rsync -az \
            -e "ssh $SSH_OPTS" \
            scripts/ensure-production-secrets.sh \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/scripts/ensure-production-secrets.sh"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "cd '$PROD_DEPLOY_PATH' && sh scripts/ensure-production-secrets.sh"

      - name: Enforce 000189 asset scope parity before deployment
        if: ${{ inputs.deploy_mode != 'diagnose-production-runtime-revision' && inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target' && inputs.deploy_mode != 'diagnose-yuzhou-hr-capacity' && inputs.deploy_mode != 'diagnose-yuzhou-hr-preimport-snapshot' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-source-manifest' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-t0-target-inventory' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target-inventory' && inputs.deploy_mode != 'prepare-yuzhou-hr-production-data-volume' && (steps.deploy-mode.outputs.mode == 'database' || steps.deploy-mode.outputs.mode == 'full') }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- enforce '$PROD_DEPLOY_PATH'" < scripts/diagnose-000189-asset-scope.sh

      - name: Repair retired 000194 runtime owner rows before deployment
        if: ${{ inputs.deploy_mode != 'diagnose-production-runtime-revision' && inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target' && inputs.deploy_mode != 'diagnose-yuzhou-hr-capacity' && inputs.deploy_mode != 'diagnose-yuzhou-hr-preimport-snapshot' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-source-manifest' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-t0-target-inventory' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target-inventory' && inputs.deploy_mode != 'prepare-yuzhou-hr-production-data-volume' && (steps.deploy-mode.outputs.mode == 'database' || steps.deploy-mode.outputs.mode == 'full') }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- repair '$PROD_DEPLOY_PATH'" < scripts/repair-000194-retired-runtime-owner.sh

      - name: Enforce 000194 runtime control parity before deployment
        if: ${{ inputs.deploy_mode != 'diagnose-production-runtime-revision' && inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target' && inputs.deploy_mode != 'diagnose-yuzhou-hr-capacity' && inputs.deploy_mode != 'diagnose-yuzhou-hr-preimport-snapshot' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-source-manifest' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-t0-target-inventory' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target-inventory' && inputs.deploy_mode != 'prepare-yuzhou-hr-production-data-volume' && (steps.deploy-mode.outputs.mode == 'database' || steps.deploy-mode.outputs.mode == 'full') }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          RUN_PRODUCTION_SEED: ${{ steps.deploy-mode.outputs.run_production_seed }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- enforce '$PROD_DEPLOY_PATH' '' '$RUN_PRODUCTION_SEED'" < scripts/diagnose-000194-runtime-control.sh

      - name: Write release marker
        if: ${{ inputs.deploy_mode != 'diagnose-production-runtime-revision' && inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target' && inputs.deploy_mode != 'diagnose-yuzhou-hr-capacity' && inputs.deploy_mode != 'diagnose-yuzhou-hr-preimport-snapshot' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-source-manifest' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-t0-target-inventory' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target-inventory' && inputs.deploy_mode != 'prepare-yuzhou-hr-production-data-volume' && steps.deploy-mode.outputs.mode != 'ops-only' }}
        run: |
          cat > .release.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "workflow": "${GITHUB_WORKFLOW}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Deploy
        if: ${{ inputs.deploy_mode != 'diagnose-production-runtime-revision' && inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target' && inputs.deploy_mode != 'diagnose-yuzhou-hr-capacity' && inputs.deploy_mode != 'diagnose-yuzhou-hr-preimport-snapshot' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-source-manifest' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-t0-target-inventory' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target-inventory' && inputs.deploy_mode != 'prepare-yuzhou-hr-production-data-volume' && steps.deploy-mode.outputs.mode != 'ops-only' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          PROD_DEPLOY_MODE: ${{ steps.deploy-mode.outputs.mode }}
          RUN_PRODUCTION_SEED: ${{ steps.deploy-mode.outputs.run_production_seed }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          case "$GITHUB_RUN_ID" in
            ""|*[!0-9]*) echo "Invalid GitHub run id for rollback snapshot: $GITHUB_RUN_ID" >&2; exit 2 ;;
          esac
          rollback_root="${PROD_DEPLOY_PATH}.runner-rollback/${GITHUB_RUN_ID}"
          cleanup_rollback_snapshot() {
            ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" "rm -rf -- '$rollback_root'"
          }
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "set -eu; mkdir -p '$rollback_root'; rsync -a --delete \
              --exclude='.env' --exclude='.env.*' --exclude='uploads/' --exclude='storage/' --exclude='data/' --exclude='tmp/' \
              '$PROD_DEPLOY_PATH/' '$rollback_root/'"
          rollback_release() {
            trap - ERR
            echo "Deployment failed; restoring the previous application source snapshot." >&2
            if ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "set -eu; rsync -a --delete \
                --exclude='.env' --exclude='.env.*' --exclude='uploads/' --exclude='storage/' --exclude='data/' --exclude='tmp/' \
                '$rollback_root/' '$PROD_DEPLOY_PATH/'" && \
              rsync -azR \
                -e "ssh $SSH_OPTS" \
                scripts/db-migrate.sh database/migration-replacements.txt database/migration-replacements/ \
                "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/" && \
              ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "set -eu; cd '$PROD_DEPLOY_PATH'; \
                docker compose --env-file .env.production -f infra/docker/docker-compose.prod.yml build api web --build-arg RELEASE_COMMIT=; \
                docker compose --env-file .env.production -f infra/docker/docker-compose.prod.yml up -d postgres api web; \
                MODE=full sh scripts/prod-healthcheck.sh; \
                PRUNE_DOCKER_BUILD_CACHE=yes sh scripts/prod-docker-cleanup.sh"; then
              cleanup_rollback_snapshot
            else
              echo "Rollback failed; preserving source snapshot for manual recovery: $rollback_root" >&2
              return 1
            fi
          }
          trap rollback_release ERR
          if [ "$PROD_DEPLOY_MODE" = "full" ]; then
            rsync -az --delete \
              -e "ssh $SSH_OPTS" \
              --exclude='.git/' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='node_modules/' \
              --exclude='**/node_modules/' \
              --exclude='.next/' \
              --exclude='**/.next/' \
              --exclude='dist/' \
              --exclude='**/dist/' \
              --exclude='coverage/' \
              --exclude='**/coverage/' \
              --exclude='logs/' \
              --exclude='tmp/' \
              --exclude='temp/' \
              --exclude='uploads/' \
              --exclude='storage/' \
              --exclude='data/' \
              ./ "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/"
          else
            manifest="$(mktemp)"
            trap 'rm -f "$manifest"' EXIT INT TERM
            node scripts/production-deploy-transfer-manifest.mjs "$PROD_DEPLOY_MODE" > "$manifest"
            while IFS=: read -r kind path; do
              case "$kind:$path" in
                file:.release.json|file:apps/web/public/runtime-design-system.css|file:scripts/*.sh|dir:apps/web|dir:apps/api|dir:packages/config|dir:packages/shared|dir:packages/ui|dir:database) ;;
                *) echo "Unsafe production transfer entry: $kind:$path" >&2; exit 2 ;;
              esac
              remote_parent="${path%/*}"
              [ "$remote_parent" = "$path" ] && remote_parent="."
              ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" "mkdir -p '$PROD_DEPLOY_PATH/$remote_parent'"
              if [ "$kind" = "dir" ]; then
                rsync -az --delete \
                  --exclude='node_modules/' --exclude='.next/' --exclude='dist/' --exclude='coverage/' \
                  -e "ssh $SSH_OPTS" "$path/" "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/$path/"
              elif [ "$kind" = "file" ]; then
                rsync -az -e "ssh $SSH_OPTS" "$path" "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/$path"
              else
                echo "Unsupported production transfer kind: $kind" >&2
                exit 2
              fi
            done < "$manifest"
            rm -f "$manifest"
            trap - EXIT INT TERM
          fi
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo PRODUCTION_RELEASE_COMMIT_INVALID >&2; exit 1; }
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" "cd '$PROD_DEPLOY_PATH' && RELEASE_COMMIT='$GITHUB_SHA' PROD_DEPLOY_MODE='$PROD_DEPLOY_MODE' RUN_PRODUCTION_SEED='$RUN_PRODUCTION_SEED' PRUNE_DOCKER_AFTER_DEPLOY=yes PRUNE_DOCKER_BUILD_CACHE=yes pnpm prod:deploy && pnpm prod:health"
          trap - ERR
          cleanup_rollback_snapshot

      - name: Verify protected acceptance accounts in Production
        if: ${{ inputs.deploy_mode != 'diagnose-production-runtime-revision' && inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target' && inputs.deploy_mode != 'diagnose-yuzhou-hr-capacity' && inputs.deploy_mode != 'diagnose-yuzhou-hr-preimport-snapshot' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-source-manifest' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-t0-target-inventory' && inputs.deploy_mode != 'diagnose-yuzhou-hr-production-target-inventory' && inputs.deploy_mode != 'prepare-yuzhou-hr-production-data-volume' && steps.deploy-mode.outputs.mode != 'ops-only' }}
        env:
          PROD_UAT_CREDENTIALS_CSV: ${{ secrets.PROD_UAT_CREDENTIALS_CSV }}
        run: |
          set -eu
          test -n "$PROD_UAT_CREDENTIALS_CSV"
          credentials="$(mktemp)"
          trap 'rm -f "$credentials"' EXIT INT TERM
          umask 077
          printf '%s' "$PROD_UAT_CREDENTIALS_CSV" > "$credentials"
          node scripts/go-live-uat-user-login-check.mjs \
            --credentials "$credentials" \
            --api-base https://park.cnjinhu.com/api/v1 \
            --web-base https://park.cnjinhu.com
