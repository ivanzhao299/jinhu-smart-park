name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deployment mode. diagnose modes are read-only and never deploy."
        required: true
        default: auto
        type: choice
        options:
          - auto
          - fast-css
          - web
          - api
          - database
          - full
          - diagnose-000189-scope
          - diagnose-000194-runtime-control

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    name: Classify production release
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve pre-verification scope
        id: scope
        env:
          REQUESTED_DEPLOY_MODE: ${{ inputs.deploy_mode }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          requested="${REQUESTED_DEPLOY_MODE:-auto}"
          case "$requested" in
            diagnose-000189-scope|diagnose-000194-runtime-control)
              echo "mode=ops-only" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$requested" = "auto" ]; then
              echo "mode=full" >> "$GITHUB_OUTPUT"
            else
              case "$requested" in
                fast-css|web|api|database|full) echo "mode=$requested" >> "$GITHUB_OUTPUT" ;;
                *) echo "Unsupported deployment mode: $requested" >&2; exit 2 ;;
              esac
            fi
            exit 0
          fi
          changed_files=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          fi
          printf '%s\n' "$changed_files" | node scripts/resolve-production-deploy-scope.mjs --requested=auto --github-output >> "$GITHUB_OUTPUT"

  verify:
    name: Verify production release
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        if: ${{ needs.classify.outputs.mode != 'ops-only' && needs.classify.outputs.mode != 'fast-css' }}
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: ${{ needs.classify.outputs.mode != 'ops-only' && needs.classify.outputs.mode != 'fast-css' }}
        run: pnpm install --frozen-lockfile

      - name: Validate deployment governance contracts
        run: |
          sh scripts/e2e/production-deploy-path-contract.sh
          node scripts/e2e/production-deploy-route-contract.mjs
          node scripts/e2e/production-deploy-scope.contract.mjs
          node scripts/e2e/production-deploy-transfer.contract.mjs
          node scripts/e2e/production-deploy-verified-scope.contract.mjs
          git diff --check

      - name: Validate runtime design system CSS
        if: ${{ needs.classify.outputs.mode == 'fast-css' }}
        run: node scripts/check-css-architecture.mjs

      - name: Build shared contracts
        if: ${{ needs.classify.outputs.mode == 'web' || needs.classify.outputs.mode == 'api' }}
        run: pnpm --filter @jinhu/shared build

      - name: Validate Web release
        if: ${{ needs.classify.outputs.mode == 'web' }}
        run: |
          pnpm --filter @jinhu/shared test
          pnpm --filter @jinhu/web typecheck
          pnpm --filter @jinhu/web lint
          pnpm test:unit:web
          pnpm css:check
          pnpm --filter @jinhu/web build

      - name: Validate API release
        if: ${{ needs.classify.outputs.mode == 'api' }}
        run: |
          pnpm --filter @jinhu/shared test
          pnpm --filter @jinhu/api typecheck
          pnpm --filter @jinhu/api lint
          pnpm --filter @jinhu/api test:unit
          pnpm --filter @jinhu/api build

      - name: Validate database-sensitive release
        if: ${{ needs.classify.outputs.mode == 'database' }}
        run: |
          sh -n scripts/db-migrate.sh scripts/db-seed-prod.sh scripts/bootstrap-admin.sh scripts/check-init-baseline.sh
          node scripts/e2e/migration-prerequisite-contract.mjs
          sh scripts/e2e/prod-deploy-seed-precedence.sh

      - name: Validate full release
        if: ${{ needs.classify.outputs.mode == 'full' }}
        run: |
          pnpm --filter @jinhu/shared build
          pnpm typecheck
          pnpm lint
          pnpm test:unit
          pnpm css:check
          pnpm build

  deploy:
    name: Deploy to production host
    needs: [classify, verify]
    if: ${{ needs.classify.outputs.mode != 'ops-only' || startsWith(inputs.deploy_mode, 'diagnose-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Trust production host
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: ssh-keyscan -p "$PROD_SSH_PORT" -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Enforce Studio and production deployment path separation
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- '$PROD_DEPLOY_PATH'" < scripts/validate-production-deploy-path.sh

      - name: Resolve deployment mode
        if: ${{ inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' }}
        id: deploy-mode
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          REQUESTED_DEPLOY_MODE: ${{ inputs.deploy_mode }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          requested="${REQUESTED_DEPLOY_MODE:-auto}"
          run_production_seed="no"
          previous_commit="$(ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" "node -e \"try{const r=require('$PROD_DEPLOY_PATH/.release.json'); process.stdout.write(r.commit||'')}catch(e){}\"" || true)"
          previous_commit_valid="no"
          changed_files=""
          if [ -n "$previous_commit" ] && git cat-file -e "$previous_commit^{commit}" 2>/dev/null; then
            previous_commit_valid="yes"
            changed_files="$(git diff --name-only "$previous_commit" "$GITHUB_SHA" || true)"
          fi
          if [ "$previous_commit_valid" = "no" ] || printf "%s\n" "$changed_files" | grep -Eq '^database/seeds/(000001_s1_production_core\.sql|production/)'; then
            run_production_seed="yes"
          fi
          resolved="$(printf '%s\n' "$changed_files" | node scripts/resolve-production-deploy-scope.mjs --requested="$requested" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).mode))")"
          if [ "$run_production_seed" = "yes" ]; then
            case "$resolved" in
              web|fast-css|ops-only)
                echo "Production seed changes require a database-capable deployment; overriding mode '$resolved' to 'database'."
                resolved="database"
                ;;
            esac
          fi
          printf "requested=%s\nresolved=%s\nprevious_commit=%s\nrun_production_seed=%s\n" "$requested" "$resolved" "$previous_commit" "$run_production_seed"
          echo "mode=$resolved" >> "$GITHUB_OUTPUT"
          echo "run_production_seed=$run_production_seed" >> "$GITHUB_OUTPUT"

      - name: Enforce verified deployment scope
        if: ${{ inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' }}
        env:
          VERIFIED_DEPLOY_MODE: ${{ needs.classify.outputs.mode }}
          RESOLVED_DEPLOY_MODE: ${{ steps.deploy-mode.outputs.mode }}
        run: |
          set -eu
          node scripts/assert-verified-production-deploy-scope.mjs \
            --verified="$VERIFIED_DEPLOY_MODE" \
            --resolved="$RESOLVED_DEPLOY_MODE"

      - name: Diagnose 000189 asset scope parity (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-000189-scope' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- report '$PROD_DEPLOY_PATH'" < scripts/diagnose-000189-asset-scope.sh

      - name: Diagnose 000194 runtime control parity (read-only)
        if: ${{ inputs.deploy_mode == 'diagnose-000194-runtime-control' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- report '$PROD_DEPLOY_PATH'" < scripts/diagnose-000194-runtime-control.sh

      - name: Ensure required production secrets
        if: ${{ inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && steps.deploy-mode.outputs.mode != 'ops-only' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          rsync -az \
            -e "ssh $SSH_OPTS" \
            scripts/ensure-production-secrets.sh \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/scripts/ensure-production-secrets.sh"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "cd '$PROD_DEPLOY_PATH' && sh scripts/ensure-production-secrets.sh"

      - name: Enforce 000189 asset scope parity before deployment
        if: ${{ inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && (steps.deploy-mode.outputs.mode == 'database' || steps.deploy-mode.outputs.mode == 'full') }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- enforce '$PROD_DEPLOY_PATH'" < scripts/diagnose-000189-asset-scope.sh

      - name: Repair retired 000194 runtime owner rows before deployment
        if: ${{ inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && (steps.deploy-mode.outputs.mode == 'database' || steps.deploy-mode.outputs.mode == 'full') }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- repair '$PROD_DEPLOY_PATH'" < scripts/repair-000194-retired-runtime-owner.sh

      - name: Enforce 000194 runtime control parity before deployment
        if: ${{ inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && (steps.deploy-mode.outputs.mode == 'database' || steps.deploy-mode.outputs.mode == 'full') }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          RUN_PRODUCTION_SEED: ${{ steps.deploy-mode.outputs.run_production_seed }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sh -s -- enforce '$PROD_DEPLOY_PATH' '' '$RUN_PRODUCTION_SEED'" < scripts/diagnose-000194-runtime-control.sh

      - name: Write release marker
        if: ${{ inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && steps.deploy-mode.outputs.mode != 'ops-only' }}
        run: |
          cat > .release.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "workflow": "${GITHUB_WORKFLOW}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Deploy
        if: ${{ inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && steps.deploy-mode.outputs.mode != 'ops-only' }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          PROD_DEPLOY_MODE: ${{ steps.deploy-mode.outputs.mode }}
          RUN_PRODUCTION_SEED: ${{ steps.deploy-mode.outputs.run_production_seed }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          case "$GITHUB_RUN_ID" in
            ""|*[!0-9]*) echo "Invalid GitHub run id for rollback snapshot: $GITHUB_RUN_ID" >&2; exit 2 ;;
          esac
          rollback_root="${PROD_DEPLOY_PATH}.runner-rollback/${GITHUB_RUN_ID}"
          cleanup_rollback_snapshot() {
            ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" "rm -rf -- '$rollback_root'"
          }
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "set -eu; mkdir -p '$rollback_root'; rsync -a --delete \
              --exclude='.env' --exclude='.env.*' --exclude='uploads/' --exclude='storage/' --exclude='data/' --exclude='tmp/' \
              '$PROD_DEPLOY_PATH/' '$rollback_root/'"
          rollback_release() {
            trap - ERR
            echo "Deployment failed; restoring the previous application source snapshot." >&2
            if ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "set -eu; rsync -a --delete \
                --exclude='.env' --exclude='.env.*' --exclude='uploads/' --exclude='storage/' --exclude='data/' --exclude='tmp/' \
                '$rollback_root/' '$PROD_DEPLOY_PATH/'" && \
              rsync -azR \
                -e "ssh $SSH_OPTS" \
                scripts/db-migrate.sh database/migration-replacements.txt database/migration-replacements/ \
                "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/" && \
              ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "set -eu; cd '$PROD_DEPLOY_PATH'; \
                docker compose --env-file .env.production -f infra/docker/docker-compose.prod.yml build api web; \
                docker compose --env-file .env.production -f infra/docker/docker-compose.prod.yml up -d postgres api web; \
                MODE=full sh scripts/prod-healthcheck.sh; \
                PRUNE_DOCKER_BUILD_CACHE=yes sh scripts/prod-docker-cleanup.sh"; then
              cleanup_rollback_snapshot
            else
              echo "Rollback failed; preserving source snapshot for manual recovery: $rollback_root" >&2
              return 1
            fi
          }
          trap rollback_release ERR
          if [ "$PROD_DEPLOY_MODE" = "full" ]; then
            rsync -az --delete \
              -e "ssh $SSH_OPTS" \
              --exclude='.git/' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='node_modules/' \
              --exclude='**/node_modules/' \
              --exclude='.next/' \
              --exclude='**/.next/' \
              --exclude='dist/' \
              --exclude='**/dist/' \
              --exclude='coverage/' \
              --exclude='**/coverage/' \
              --exclude='logs/' \
              --exclude='tmp/' \
              --exclude='temp/' \
              --exclude='uploads/' \
              --exclude='storage/' \
              --exclude='data/' \
              ./ "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/"
          else
            manifest="$(mktemp)"
            trap 'rm -f "$manifest"' EXIT INT TERM
            node scripts/production-deploy-transfer-manifest.mjs "$PROD_DEPLOY_MODE" > "$manifest"
            while IFS=: read -r kind path; do
              case "$kind:$path" in
                file:.release.json|file:apps/web/public/runtime-design-system.css|file:scripts/*.sh|dir:apps/web|dir:apps/api|dir:packages/config|dir:packages/shared|dir:packages/ui|dir:database) ;;
                *) echo "Unsafe production transfer entry: $kind:$path" >&2; exit 2 ;;
              esac
              remote_parent="${path%/*}"
              [ "$remote_parent" = "$path" ] && remote_parent="."
              ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" "mkdir -p '$PROD_DEPLOY_PATH/$remote_parent'"
              if [ "$kind" = "dir" ]; then
                rsync -az --delete \
                  --exclude='node_modules/' --exclude='.next/' --exclude='dist/' --exclude='coverage/' \
                  -e "ssh $SSH_OPTS" "$path/" "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/$path/"
              elif [ "$kind" = "file" ]; then
                rsync -az -e "ssh $SSH_OPTS" "$path" "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/$path"
              else
                echo "Unsupported production transfer kind: $kind" >&2
                exit 2
              fi
            done < "$manifest"
            rm -f "$manifest"
            trap - EXIT INT TERM
          fi
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" "cd '$PROD_DEPLOY_PATH' && PROD_DEPLOY_MODE='$PROD_DEPLOY_MODE' RUN_PRODUCTION_SEED='$RUN_PRODUCTION_SEED' PRUNE_DOCKER_AFTER_DEPLOY=yes PRUNE_DOCKER_BUILD_CACHE=yes pnpm prod:deploy && pnpm prod:health"
          trap - ERR
          cleanup_rollback_snapshot

      - name: Verify protected acceptance accounts in Production
        if: ${{ inputs.deploy_mode != 'diagnose-000189-scope' && inputs.deploy_mode != 'diagnose-000194-runtime-control' && steps.deploy-mode.outputs.mode != 'ops-only' }}
        env:
          PROD_UAT_CREDENTIALS_CSV: ${{ secrets.PROD_UAT_CREDENTIALS_CSV }}
        run: |
          set -eu
          test -n "$PROD_UAT_CREDENTIALS_CSV"
          credentials="$(mktemp)"
          trap 'rm -f "$credentials"' EXIT INT TERM
          umask 077
          printf '%s' "$PROD_UAT_CREDENTIALS_CSV" > "$credentials"
          node scripts/go-live-uat-user-login-check.mjs \
            --credentials "$credentials" \
            --api-base https://park.cnjinhu.com/api/v1 \
            --web-base https://park.cnjinhu.com
