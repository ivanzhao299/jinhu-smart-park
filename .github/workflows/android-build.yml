name: Build and Publish Android Client

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
      - "scripts/verify-android-release.mjs"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "本次 Android 版本说明"
        required: false
        default: "稳定性与移动作业体验优化"

concurrency:
  group: android-client-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Require Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p android-app/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-app/signing/release.keystore
          chmod 600 android-app/signing/release.keystore
          cat > android-app/signing.properties <<EOF
          storeFile=signing/release.keystore
          storeType=PKCS12
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android-app/signing.properties

      - name: Build signed release APK
        working-directory: android-app
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify signature and version metadata
        id: version
        run: |
          set -eu
          apk="android-app/app/build/outputs/apk/release/app-release.apk"
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$build_tools_dir/apksigner"
          test -x "$build_tools_dir/aapt"
          "$build_tools_dir/apksigner" verify --verbose --print-certs "$apk"
          badging="$($build_tools_dir/aapt dump badging "$apk" | head -1)"
          version_code="$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          version_name="$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          expected_code="$(grep -oP 'versionCode\s*=\s*\K\d+' android-app/app/build.gradle.kts)"
          expected_name="$(grep -oP 'versionName\s*=\s*"\K[^"]+' android-app/app/build.gradle.kts)"
          test "$version_code" = "$expected_code"
          test "$version_name" = "$expected_name"
          printf 'version_code=%s\nversion_name=%s\n' "$version_code" "$version_name" >> "$GITHUB_OUTPUT"

      - name: Prepare authenticated-page download assets
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes || '稳定性与移动作业体验优化' }}
        run: |
          set -eu
          source_apk="android-app/app/build/outputs/apk/release/app-release.apk"
          release_dir="apps/web/public/downloads/android"
          file_name="smart-park-v${VERSION_NAME}.apk"
          mkdir -p "$release_dir"
          find "$release_dir" -maxdepth 1 -type f -name 'smart-park-v*.apk' -delete
          cp "$source_apk" "$release_dir/$file_name"
          cp "$source_apk" "$release_dir/smart-park-latest.apk"
          export sha256="$(sha256sum "$source_apk" | awk '{print $1}')"
          export size_bytes="$(stat -c '%s' "$source_apk")"
          export built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node - "$release_dir/latest.json" <<'NODE'
          const fs = require('node:fs');
          const [output] = process.argv.slice(2);
          const manifest = {
            platform: 'android',
            versionCode: Number(process.env.VERSION_CODE),
            versionName: process.env.VERSION_NAME,
            fileName: `smart-park-v${process.env.VERSION_NAME}.apk`,
            downloadUrl: `/downloads/android/smart-park-v${process.env.VERSION_NAME}.apk`,
            sha256: process.env.sha256,
            sizeBytes: Number(process.env.size_bytes),
            builtAt: process.env.built_at,
            commit: process.env.GITHUB_SHA,
            releaseNotes: process.env.RELEASE_NOTES
          };
          fs.writeFileSync(output, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Verify published asset contract
        run: node scripts/verify-android-release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: smart-park-android-v${{ steps.version.outputs.version_name }}
          path: |
            apps/web/public/downloads/android/smart-park-v${{ steps.version.outputs.version_name }}.apk
            apps/web/public/downloads/android/latest.json
          retention-days: 90

      - name: Commit release assets for Web-level production deployment
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/downloads/android/
          if git diff --cached --quiet; then
            echo "Android release assets unchanged"
            exit 0
          fi
          git commit -m "chore(android): publish v${VERSION_NAME} (code ${VERSION_CODE}) [skip android-build]"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          git push origin HEAD:main

      - name: Dispatch Web-level production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-production.yml --ref main -f deploy_mode=web
