name: Activate Smart Park Runner Account

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activate-smart-park-runner-production
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      - name: Trust production host
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: ssh-keyscan -p "$PROD_SSH_PORT" -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate protected password hash
        env:
          SMART_PARK_RUNNER_PASSWORD: ${{ secrets.SMART_PARK_RUNNER_PASSWORD }}
        run: |
          test -n "$SMART_PARK_RUNNER_PASSWORD"
          pnpm --filter @jinhu/api exec node -e "import('bcrypt').then(async b => process.stdout.write(await b.hash(process.env.SMART_PARK_RUNNER_PASSWORD, 12)))" > /tmp/smart-park-runner.hash
          chmod 600 /tmp/smart-park-runner.hash
      - name: Activate dedicated production account
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          SMART_PARK_RUNNER_PASSWORD: ${{ secrets.SMART_PARK_RUNNER_PASSWORD }}
        run: |
          set -eu
          SSH_OPTS="-p $PROD_SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          cleanup_remote_runner_activation() {
            ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "rm -f -- '$PROD_DEPLOY_PATH/tmp/smart-park-runner.hash.send' '$PROD_DEPLOY_PATH/tmp/activate-smart-park-runner-account.sh'" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_remote_runner_activation EXIT HUP INT TERM
          install -m 600 /tmp/smart-park-runner.hash /tmp/smart-park-runner.hash.send
          rsync -az -e "ssh $SSH_OPTS" scripts/activate-smart-park-runner-account.sh /tmp/smart-park-runner.hash.send \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/tmp/"
          ssh $SSH_OPTS "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "set -eu; cd '$PROD_DEPLOY_PATH'; cleanup_runner_activation() { rm -f -- tmp/smart-park-runner.hash.send tmp/activate-smart-park-runner-account.sh; }; trap cleanup_runner_activation EXIT HUP INT TERM; SMART_PARK_RUNNER_PASSWORD_HASH=\"\$(cat tmp/smart-park-runner.hash.send)\" bash tmp/activate-smart-park-runner-account.sh"
          response="$(node -e 'process.stdout.write(JSON.stringify({tenantId:"10000001",parkId:"20000001",username:"studio_runner",password:process.env.SMART_PARK_RUNNER_PASSWORD}))' | \
            curl -fsS -X POST 'https://park.cnjinhu.com/api/v1/auth/login' -H 'content-type: application/json' --data-binary @-)"
          node -e 'const body=JSON.parse(process.argv[1]); if(!(body.data?.accessToken||body.accessToken)) process.exit(1)' "$response"

      - name: Remove local credential artifacts
        if: always()
        run: rm -f -- /tmp/smart-park-runner.hash /tmp/smart-park-runner.hash.send
