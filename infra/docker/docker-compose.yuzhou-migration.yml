name: jinhu_yuzhou_migration_lab

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: "no"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${YUZHOU_SQLSERVER_SA_PASSWORD:?Set YUZHOU_SQLSERVER_SA_PASSWORD in the local shell}
    ports:
      - "127.0.0.1:${YUZHOU_SQLSERVER_PORT:-14333}:1433"
    volumes:
      - yuzhou-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  yuzhou-sqlserver-data:
